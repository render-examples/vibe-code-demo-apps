# demo-user/ironridge-meatpacking — generated by the Vibe Code factory.
# Prompt: Create a website for a meat packing plant

services:
  - type: web
    name: vibe-demo-user-ironridge-meatpacking-web
    runtime: static
    rootDir: apps/demo-user/ironridge-meatpacking
    buildCommand: mkdir -p dist && cp index.html about.html products.html wholesale.html quality.html contact.html styles.css common.js products.js dist/ && cp -r assets dist/ && cp -r specs dist/
